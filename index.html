<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi Prinshesa · Día del Amor</title>
  <style>
    /* reset y base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* FONDO PASTEL - Verde menta y lima suave */
    body {
      background: linear-gradient(145deg, #f0fdf4 0%, #dcfce7 40%, #bbf7d0 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Te Amo', cursive, sans-serif;
      padding: 1rem;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* contenedor principal - Vidrio esmerilado claro */
    .love-scene {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 20px 40px rgba(100, 200, 100, 0.2);
      overflow: hidden;
      transition: all 0.2s;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* ------- FASE 1: corazón gigante CENTRADO ------- */
    .heart-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 0.5rem;
      transition: opacity 0.8s ease;
      position: relative;
      z-index: 10;
      cursor: pointer;
      text-align: center;
    }

    .big-heart {
        display: flex;
        justify-content: center;
        align-items: center;
        line-height: 1;
        filter: drop-shadow(0 8px 30px rgba(0,200,50,.4));
        animation: heartbeat 1.6s ease-in-out infinite;
        transition: transform .3s ease;
        user-select: none;
    }
    
    .heart-img{
        width: clamp(50%, 50%, 50%);
        height: auto;
        display: block;
        pointer-events: none;
        user-select: none;
    }
    
    .big-heart:hover {
      transform: scale(1.08);
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.2); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    /* TEXTO PRINCIPAL - Verde oscuro elegante para que destaque sobre el fondo claro */
    .side-text {
      font-size: clamp(2rem, 6vw, 4rem);
      font-family: 'Te Amo', 'Segoe UI', cursive;
      color: #064e3b; /* Verde esmeralda profundo */
      text-shadow: 0 2px 15px rgba(50, 200, 50, 0.2);
      font-weight: 700;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.5);
      padding: 0.3rem 1.5rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: inline-block;
    }

    .click-hint {
      color: #047857;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      opacity: 0.8;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.3rem 1.2rem;
      border-radius: 30px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(100, 200, 100, 0.2);
    }

    /* ------- CONTENEDOR DEL CORAZÓN DE FOTOS ------- */
    .image-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.8s ease;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;  /* Pegado a la izquierda */
      padding-left: 5%;
      padding-top: 3%;
    }

    .image-container.show {
      opacity: 1;
    }

    /* Collage de fotos Polaroid */
    #collage-container {
      position: relative;
      width: 420px; /* El JS espera este tamaño exacto */
      height: 500px;
      pointer-events: auto; /* Permite interactuar con las fotos */
    }

    .frame {
      position: absolute;
      background-color: white;
      padding: 8px 8px 25px 8px; /* Efecto polaroid */
      box-shadow: 0 6px 20px rgba(0, 50, 0, 0.15);
      transform-origin: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease, z-index 0.3s ease;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    /* La imagen dentro del marco */
    .frame img {
      display: block;
      width: 70px;
      height: 70px;
      object-fit: cover;
      background-color: #e5e7eb;
    }

    /* Efecto al pasar el mouse */
    .frame:hover {
      transform: scale(1.2) rotate(0deg) !important; 
      z-index: 100;
      box-shadow: 0 10px 35px rgba(0, 100, 0, 0.25);
    }

    /* ------- BOLITA VERDE QUE CAE ------- */
    .ball-falling {
      position: absolute;
      top: -10%;
      left: 50%;
      margin-left: -18px;   /* mitad del ancho (36px) para centrar */
      width: 36px;
      height: 36px;
      background: radial-gradient(circle at 30% 30%, #86efac, #16a34a);
      border-radius: 50%;
      box-shadow: 0 0 30px #86efac;
      z-index: 30;
      transition: all 0.1s linear;
      opacity: 0;
      pointer-events: none;
    }

    .ball-falling.active {
      opacity: 1;
    }

    /* ------- MENSAJE PRINCIPAL - OCUPA TODO EL ALTO, A LA DERECHA ------- */
    .message-overlay {
      position: absolute;
      top: 5%;
      right: 3%;
      width: 42%;
      height: 88%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      padding: 2rem 2rem;
      border-radius: 48px 16px 48px 16px;
      box-shadow: 0 20px 40px rgba(0, 100, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
      z-index: 40;
      opacity: 0;
      transform: translateX(30px) scale(0.95);
      transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
      pointer-events: none;
      text-align: center;
      font-family: 'Te Amo', 'Segoe UI', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .message-overlay.show {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .message-overlay .te-amo-grande {
      font-size: clamp(2rem, 6vw, 5rem);
      color: #064e3b;
      font-weight: 900;
      text-shadow: 0 2px 20px rgba(0, 200, 50, 0.15);
      margin: 0.2rem 0;
      letter-spacing: 0.1em;
    }

    .message-overlay p {
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      color: #065f46;
      line-height: 1.8;
      margin-top: 0.5rem;
    }

    .time-counter {
      font-weight: 700;
      color: #064e3b;
      background: rgba(200, 230, 200, 0.6);
      padding: 0.3rem 1.5rem;
      border-radius: 60px;
      display: inline-block;
      margin-top: 0.8rem;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(100, 200, 100, 0.3);
    }

    /* ------- PETALOS - IMÁGENES DE CORAZÓN Y "TE AMO" ------- */
    .petal {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0.7;
      pointer-events: none;
      z-index: 15;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(0.7);
        opacity: 0.9;
      }
      100% {
        transform: translateY(110vh) rotate(720deg) scale(0.2);
        opacity: 0.1;
      }
    }

    /* ------- RESPONSIVE PARA CELULARES Y TABLETS ------- */
    @media (max-width: 850px) {
      .love-scene {
        aspect-ratio: auto;
        min-height: 100dvh;
        height: auto;
        border-radius: 32px;
        padding: 0rem;
        flex-direction: column;
        flex-wrap: nowrap;
        justify-content: flex-start;
        align-items: center;
        background: rgba(255, 255, 255, 0.4);
      }

      .heart-text-wrapper {
        height: auto;
        min-height: 80vh;
        padding: 1rem;
      }
      
      .heart-img {
        width: clamp(30%, 60%, 60%);
      }

      .side-text {
        font-size: clamp(1.5rem, 6vw, 2.8rem);
        padding: 0.2rem 1rem;
      }

      .image-container {
        position: relative;
        width: 100%;
        height: auto;
        padding: 1rem 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 0 0 auto;
      }

      #collage-container {
        transform: scale(0.7);
        transform-origin: center center;
      }

      .message-overlay {
        position: relative;
        width: 92%;
        right: auto;
        top: auto;
        height: auto;
        min-height: 200px;
        padding: 1.5rem;
        margin: 0 auto 2rem auto;
        border-radius: 48px;
        transform: translateY(30px) scale(0.95);
      }

      .message-overlay.show {
        transform: translateY(0) scale(1);
      }

      .ball-falling {
        width: 28px;
        height: 28px;
        margin-left: -14px;
      }

      .message-overlay .te-amo-grande {
        font-size: clamp(2.5rem, 5vw, 4rem);
      }
    }

    @media (max-width: 500px) {
      .love-scene {
        border-radius: 20px;
      }
      #collage-container {
        transform: scale(0.55);
        transform-origin: center center;
      }
      .message-overlay {
        width: 95%;
        padding: 1.2rem;
        border-radius: 32px;
      }
      .message-overlay p {
        font-size: clamp(1rem, 2.5vw, 1.4rem);
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="love-scene" id="loveScene">

  <!-- fase 1: corazón gigante CENTRADO -->
  <div class="heart-text-wrapper" id="heartTextWrapper">
    <div class="big-heart" id="clickHeart">
      <img src="corazonverde.png" alt="Corazón" class="heart-img">
    </div>
    <div class="side-text">Mi Prinshesa</div>
    <div class="click-hint">HAZ CLICK EN EL CORAZÓN</div>
  </div>

  <!-- BOLITA VERDE (centrada) -->
  <div class="ball-falling" id="ballFalling"></div>

  <!-- Contenedor del Corazón de Fotos -->
  <div class="image-container" id="imageContainer">
    <div id="collage-container"></div>
  </div>

  <!-- mensaje principal -->
  <div class="message-overlay" id="messageOverlay">
    <div class="te-amo-grande">TE AMO</div>
    <p>Hoy 1 de agosto, aun no somos novios, 
       pronto lo seremos mi prinshesa, </br>
       soy el hombre mas afortunado por tenerte,
       quiero siempre seguir siendo tu bb tikito
       y tu mi prinshesa
    </p>
    <p>
      <span class="time-counter" id="timeCounter">31 días · 7h · 41m · 41s</span>
    </p>
  </div>

</div>

<script>
  (function() {
    const loveScene = document.getElementById('loveScene');
    const heartWrapper = document.getElementById('heartTextWrapper');
    const clickHeart = document.getElementById('clickHeart');
    const ball = document.getElementById('ballFalling');
    const imageContainer = document.getElementById('imageContainer');
    const messageOverlay = document.getElementById('messageOverlay');
    const timeCounter = document.getElementById('timeCounter');

    // Fecha de inicio (simulada: 31 días atrás)
    const startDate = new Date();
    startDate.setDate(startDate.getDate() - 31);
    startDate.setHours(startDate.getHours() - 7);
    startDate.setMinutes(startDate.getMinutes() - 45);
    startDate.setSeconds(startDate.getSeconds() - 41);

    // Actualiza el contador de tiempo
    function updateCounter() {
      const now = new Date();
      let diff = Math.floor((now - startDate) / 1000);
      if (diff < 0) diff = 0;
      const days = Math.floor(diff / 86400);
      diff %= 86400;
      const hours = Math.floor(diff / 3600);
      diff %= 3600;
      const minutes = Math.floor(diff / 60);
      const seconds = diff % 60;
      timeCounter.textContent = `${days} días · ${hours}h · ${minutes}m · ${seconds}s`;
    }
    setInterval(updateCounter, 1000);
    updateCounter();


    // ============================================================
    // CÓDIGO PARA GENERAR EL CORAZÓN DE FOTOS POLAROID
    // ============================================================
    const fotos = [
            "FOTO1.jpeg", "FOTO2.jpeg", "FOTO3.jpeg", "FOTO4.jpeg", "FOTO5.jpeg",
            "FOTO6.jpeg", "FOTO7.jpeg", "FOTO8.jpeg", "FOTO9.jpeg", "FOTO10.jpeg",
            "FOTO11.jpeg", "FOTO12.jpeg", "FOTO13.jpeg", "FOTO14.jpeg", "FOTO15.jpeg",
            "FOTO16.jpeg", "FOTO17.jpeg", "FOTO18.jpeg", "FOTO19.jpeg", "FOTO20.jpeg",
            "FOTO21.jpeg", "FOTO22.jpeg", "FOTO23.jpeg", "FOTO24.jpeg", "FOTO25.jpeg",
            "FOTO26.jpeg", "FOTO27.jpeg", "FOTO28.jpeg", "FOTO29.jpeg", "FOTO30.jpeg"
    ];

    const collageContainer = document.getElementById('collage-container');
    const frameCount = 30; // Cantidad de fotos

    // Función matemática para generar las coordenadas X, Y de un corazón
    function getHeartCoordinate(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y };
    }

    // Generar los marcos
    for (let i = 0; i < frameCount; i++) {
      let t = (i / frameCount) * 2 * Math.PI;
      t += (Math.random() - 0.5) * 0.25; 

      let pos = getHeartCoordinate(t);
      
      // Escalar para que quepa en los 420px del contenedor
      let scale = 13; 
      let x = pos.x * scale + 210; // Centrar en el contenedor (420/2)
      let y = -pos.y * scale + 250; // Centrar en el contenedor (500/2)

      const frame = document.createElement('div');
      frame.className = 'frame';
      
      const rotation = (Math.random() - 0.5) * 25; 
      const offsetX = (Math.random() - 0.5) * 15; 
      const offsetY = (Math.random() - 0.5) * 15;

      frame.style.left = (x + offsetX) + 'px';
      frame.style.top = (y + offsetY) + 'px';
      frame.style.transform = `rotate(${rotation}deg)`;

      const img = document.createElement('img');
      img.src = fotos[i % fotos.length]; 
      img.alt = `Foto ${i+1}`;
      img.draggable = false;

      frame.appendChild(img);
      collageContainer.appendChild(frame);
    }
    // ============================================================


    // ========== SECUENCIA AL HACER CLIC ==========
    let animationStarted = false;

    clickHeart.addEventListener('click', function(e) {
      e.stopPropagation();
      if (animationStarted) return;
      animationStarted = true;

      // Mostrar bolita exactamente sobre el corazón
      const heartRect = clickHeart.getBoundingClientRect();
      const sceneRect = loveScene.getBoundingClientRect();
      ball.classList.add('active');
      ball.style.marginLeft='0';
      ball.style.left=(heartRect.left-sceneRect.left+heartRect.width/2-ball.offsetWidth/2)+'px';
      ball.style.top=(heartRect.top-sceneRect.top+heartRect.height/2-ball.offsetHeight/2)+'px'; 

      let posY = -8;
      const fallInterval = setInterval(() => {
        posY += 2.2;
        if (posY >= 58) {
          clearInterval(fallInterval);
          ball.style.opacity = '0';
          
          // Aparece el corazón de fotos polaroid
          imageContainer.classList.add('show');
          
          // Ocultar el corazón + texto inicial
          heartWrapper.style.opacity = '0';
          heartWrapper.style.transition = 'opacity 1s ease';
          setTimeout(() => {
            heartWrapper.style.display = 'none';
          }, 1000);
          
          // Empezar a soltar pétalos
          startPetalRain();
          
          // Mensaje aparece
          setTimeout(() => {
            messageOverlay.classList.add('show');
          }, 600);
          return;
        }
        const startX=heartRect.left-sceneRect.left+heartRect.width/2-ball.offsetWidth/2;
        ball.style.top=(heartRect.top-sceneRect.top+heartRect.height/2-ball.offsetHeight/2+posY*6)+'px';
        ball.style.left=(startX+Math.sin(posY/5)*8)+'px';
      }, 60);
    });

    // Lluvia de corazones chiquitos (imagen) y "TE AMO"
    function startPetalRain() {
      const container = loveScene;
      let petalCount = 0;
      const maxPetals = 100;
      const rainInterval = setInterval(() => {
        if (petalCount > maxPetals) {
          clearInterval(rainInterval);
          return;
        }
        const petal = document.createElement('div');
        petal.className = 'petal';
        const size = (Math.random() * 1.6 + 1.2) + 'rem'; // Tamaño dinámico
        const x = Math.random() * 92 + 2;

        if (Math.random() < 0.6) {
          // LLUEVE LA IMAGEN corazonverde.png CHIQUITA
          const heartImg = document.createElement('img');
          heartImg.src = 'corazonverde.png';
          heartImg.alt = '';
          heartImg.style.height = size;
          heartImg.style.width = 'auto';
          heartImg.style.display = 'block';
          petal.appendChild(heartImg);
        } else {
          // LLUEVE EL TEXTO TE AMO
          petal.textContent = 'TE AMO';
          petal.style.fontSize = size;
          petal.style.color = '#064e3b';
          petal.style.fontWeight = '700';
          petal.style.textShadow = '0 2px 10px rgba(0,200,50,0.2)';
        }

        petal.style.left = x + '%';
        petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
        petal.style.animationDelay = (Math.random() * 1.5) + 's';
        container.appendChild(petal);
        petalCount++;
        setTimeout(() => {
          if (petal.parentNode) petal.remove();
        }, 10000);
      }, 180);

      // ráfaga inicial
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const petal = document.createElement('div');
          petal.className = 'petal';
          const size = (Math.random() * 1.8 + 1.2) + 'rem';
          const x = Math.random() * 90 + 5;

          if (Math.random() < 0.6) {
            const heartImg = document.createElement('img');
            heartImg.src = 'corazonverde.png';
            heartImg.alt = '';
            heartImg.style.height = size;
            heartImg.style.width = 'auto';
            heartImg.style.display = 'block';
            petal.appendChild(heartImg);
          } else {
            petal.textContent = 'TE AMO';
            petal.style.fontSize = size;
            petal.style.color = '#064e3b';
            petal.style.fontWeight = '700';
            petal.style.textShadow = '0 2px 10px rgba(0,200,50,0.2)';
          }
          petal.style.left = x + '%';
          petal.style.animationDuration = (Math.random() * 5 + 6) + 's';
          petal.style.animationDelay = '0s';
          container.appendChild(petal);
          setTimeout(() => { if (petal.parentNode) petal.remove(); }, 12000);
        }, i * 70);
      }
    }
  })();
</script>
</body>
</html>
